name: Xenogears PC WinGet smoke
on:
  push:
    branches: [xenogears-v2026.11.17-validation]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate manifest and test silent installation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $release = 'https://github.com/microsoft/winget-cli/releases/download/v1.29.380'
          $bundle = Join-Path $env:RUNNER_TEMP 'DesktopAppInstaller.msixbundle'
          $dependencyZip = Join-Path $env:RUNNER_TEMP 'DesktopAppInstaller_Dependencies.zip'
          $dependencyRoot = Join-Path $env:RUNNER_TEMP 'winget-dependencies'
          Write-Host 'Downloading official WinGet v1.29.380 and dependencies'
          Invoke-WebRequest -UseBasicParsing -Uri "$release/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle" -OutFile $bundle
          Invoke-WebRequest -UseBasicParsing -Uri "$release/DesktopAppInstaller_Dependencies.zip" -OutFile $dependencyZip
          if ((Get-FileHash $bundle).Hash -ne '65dea9c01ce08ee7b763366b27c0e651f97db857c11ca9b9c301826c10092f2e' -or
              (Get-FileHash $dependencyZip).Hash -ne 'ba875afe9d190f61218985ac0292a99d1db710bf93e13c68944ca9d89f0d82d1') {
            throw 'Microsoft WinGet asset checksum mismatch'
          }
          Expand-Archive $dependencyZip -DestinationPath $dependencyRoot
          $dependencies = (Get-ChildItem (Join-Path $dependencyRoot 'x64') -Filter '*.appx').FullName
          Add-AppxPackage -Path $bundle -DependencyPath $dependencies -ForceApplicationShutdown
          $package = Get-AppxPackage Microsoft.DesktopAppInstaller | Sort-Object Version -Descending | Select-Object -First 1
          $wingetExe = Join-Path $package.InstallLocation 'winget.exe'

          function Invoke-WinGet {
            & $wingetExe @args
            if ($LASTEXITCODE -ne 0) { throw "winget $($args[0]) exited $LASTEXITCODE" }
          }

          $manifest = 'manifests/e/EtherAura/XenogearsPC/2026.11.17'
          Invoke-WinGet --version
          Invoke-WinGet validate --manifest $manifest
          Invoke-WinGet settings --enable LocalManifestFiles
          Invoke-WinGet install --manifest $manifest --silent --disable-interactivity --accept-source-agreements --accept-package-agreements

          $key = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\xenogears-pc'
          $entry = Get-ItemProperty -LiteralPath $key
          if ($entry.DisplayName -cne 'Xenogears PC' -or $entry.DisplayVersion -cne '2026.11.17' -or
              $entry.Publisher -cne 'xenogears-pc contributors' -or $entry.QuietUninstallString -notmatch ' /S$') {
            throw 'Unexpected Apps and Features metadata'
          }
          foreach ($engine in 'xenogears.exe', 'xenogears-enhanced.exe') {
            if (-not (Test-Path -LiteralPath (Join-Path $entry.InstallLocation $engine))) {
              throw "Installed engine missing: $engine"
            }
          }

          $uninstall = Join-Path $entry.InstallLocation 'uninstall.exe'
          $exit = (Start-Process -FilePath $uninstall -ArgumentList '/S' -PassThru -Wait).ExitCode
          if ($exit -ne 0 -or (Test-Path -LiteralPath $key)) {
            throw "Silent uninstall failed (exit code $exit)"
          }
          Write-Host 'PASS WinGet manifest validation, silent install, Apps and Features metadata, and silent uninstall'
